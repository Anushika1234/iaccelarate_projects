<!DOCTYPE html>
<html>
<head>
    <title>Women's Health Assessment & Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
    <style>
        body { padding: 20px; }
        .result-section, .chat-response-section { display: none; }
        .chat-box { max-height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Women's Health Assessment & Chatbot</h1>
        
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4>Health Information</h4>
                    </div>
                    <div class="card-body">
                        <form id="predictionForm">
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label for="age" class="form-label">Age:</label>
                                    <input type="number" class="form-control" id="age" min="18" max="60" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="weight" class="form-label">Weight (kg):</label>
                                    <input type="number" class="form-control" id="weight" min="40" max="150" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="height" class="form-label">Height (cm):</label>
                                    <input type="number" class="form-control" id="height" min="130" max="200" required>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label for="bmi" class="form-label">BMI:</label>
                                    <input type="text" class="form-control" id="bmi" readonly>
                                </div>
                                <div class="col-md-4">
                                    <label for="period_regularity" class="form-label">Period Regularity:</label>
                                    <select class="form-select" id="period_regularity" required>
                                        <option value="regular">Regular</option>
                                        <option value="irregular">Irregular</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="cycle_length" class="form-label">Cycle Length (days):</label>
                                    <input type="number" class="form-control" id="cycle_length" min="15" max="45" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Assess Health Risk</button>
                        </form>
                    </div>
                </div>

                <!-- Chatbot Section -->
                <div class="card mt-4">
                    <div class="card-header bg-success text-white">
                        <h4>Health Chatbot</h4>
                    </div>
                    <div class="card-body">
                        <div class="chat-box" id="chatBox"></div>
                        <div class="mt-3">
                            <input type="text" class="form-control" id="chatQuery" placeholder="Ask about women's health...">
                            <button id="chatButton" class="btn btn-success mt-2 w-100">Ask</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            // Auto-calculate BMI
            $('#weight, #height').change(function() {
                const weight = $('#weight').val();
                const height = $('#height').val() / 100;
                if (weight && height) {
                    const bmi = (weight / (height * height)).toFixed(1);
                    $('#bmi').val(bmi);
                }
            });
            
            // Chatbot functionality
            $('#chatButton').click(function() {
                const query = $('#chatQuery').val().trim();
                if (query) {
                    $("#chatBox").append(`<div><strong>You:</strong> ${query}</div>`);
                    $('#chatQuery').val('');
                    $.post('/chat', { query: query }, function(response) {
                        $("#chatBox").append(`<div><strong>Bot:</strong> ${response.answer}</div>`);
                    });
                }
            });
        });
    </script>
</body>
</html>
